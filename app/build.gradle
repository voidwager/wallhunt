plugins { id 'com.android.application' }

android {
    namespace = 'dev.voidwager.wallhunt'
    compileSdk = 36
    defaultConfig {
        applicationId = 'dev.voidwager.wallhunt'
        minSdk = 30
        targetSdk = 36
        versionCode = 2
        versionName = '1.1'
    }
    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.debug   // personal sideload build
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    packaging {
        resources { excludes += ['META-INF/*.kotlin_module', 'META-INF/versions/**', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES'] }
    }
    lint { checkReleaseBuilds = false }
}

dependencies {
    implementation 'com.anthropic:anthropic-java:2.66.0'
}
