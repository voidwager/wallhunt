plugins { id 'com.android.application' }

// Every release must be signed with the same key, or Android refuses to install it over the old one
// and self-update breaks. The key's location and passwords live in the gitignored local.properties
// (whsign.*); builds without them fall back to the machine's debug key.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def pinnedKey = localProps.getProperty('whsign.store')

android {
    namespace = 'dev.voidwager.wallhunt'
    compileSdk = 36
    defaultConfig {
        applicationId = 'dev.voidwager.wallhunt'
        minSdk = 30
        targetSdk = 36
        // -PwhVersionCode / -PwhVersionName exist only to build an "older" copy for update testing.
        versionCode = (project.findProperty('whVersionCode') ?: 4) as int
        versionName = project.findProperty('whVersionName') ?: '1.3'
    }
    signingConfigs {
        pinned {
            if (pinnedKey != null) {
                storeFile = file(pinnedKey)
                storePassword = localProps.getProperty('whsign.storePassword')
                keyAlias = localProps.getProperty('whsign.alias')
                keyPassword = localProps.getProperty('whsign.keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = pinnedKey != null ? signingConfigs.pinned : signingConfigs.debug
        }
        debug {
            // same key as releases, so a test build can update in place to a published release
            if (pinnedKey != null) signingConfig = signingConfigs.pinned
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    packaging {
        resources { excludes += ['META-INF/*.kotlin_module', 'META-INF/versions/**', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES'] }
    }
    lint { checkReleaseBuilds = false }
}

dependencies {
    implementation 'com.anthropic:anthropic-java:2.66.0'
}
